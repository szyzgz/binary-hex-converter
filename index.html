<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Base ✨" />
<meta name="theme-color" content="#c6a4f2" />
<title>Pastel Base Converter</title>

<!-- Home-screen & tab icons -->
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root{
    /* icon-matched gradient backdrop */
    --bg:#c6a4f2;
    --bg-mid:#e9b7e6;
    --bg2:#ffc2dc;
    --panel:#ffffff;
    --ink:#5b4d69;
    --ink-soft:#9a8fab;
    --on-grad:#ffffff;      /* text sitting directly on the gradient */
    --shadow:rgba(120,80,160,.28);

    /* pastel key palette (matches the app icon) */
    --key:#efe6f6;          /* number keys */
    --key-press:#e3d6f0;
    --key-ink:#5b4d69;

    --fn:#e6d6f5;           /* function keys (AC, DEL) */
    --fn-press:#d6c0ee;
    --fn-ink:#6b4f86;

    --hex:#ffe0ec;          /* A-F hex keys */
    --hex-press:#ffccdf;
    --hex-ink:#c56791;

    --accent:#8f66d8;       /* active base pill / screen digits */
    --accent-ink:#ffffff;
    --disabled:rgba(255,255,255,.30);
    --disabled-ink:rgba(120,90,150,.45);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg-mid) 52%,var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--ink);
    display:flex;
    justify-content:center;
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  .app{
    width:100%;
    max-width:430px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:14px 18px calc(18px + env(safe-area-inset-bottom));
  }

  header{
    text-align:center;
    padding:6px 0 4px;
  }
  header h1{
    margin:0;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    color:var(--on-grad);
    text-shadow:0 1px 6px rgba(120,80,160,.30);
  }

  /* ---- readout of all bases ---- */
  .readout{
    background:var(--panel);
    border-radius:26px;
    padding:16px 18px;
    margin-top:10px;
    box-shadow:0 10px 26px var(--shadow);
    flex:0 0 auto;
  }
  .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:7px 4px;
    gap:12px;
    cursor:pointer;
    border-radius:14px;
    transition:background .15s;
  }
  .row + .row{border-top:1px solid #f1eaf8;}
  .row.active{background:#f7f0fe;}
  .row .tag{
    font-size:12px;
    font-weight:700;
    letter-spacing:.6px;
    color:var(--ink-soft);
    min-width:42px;
  }
  .row.active .tag{color:var(--accent);}
  .row .val{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum";
    font-size:21px;
    font-weight:500;
    text-align:right;
    word-break:break-all;
    line-height:1.25;
    color:var(--ink);
  }
  .row .val .muted{color:var(--ink-soft);font-weight:400;}
  .row.active .val{font-weight:700;color:var(--accent);}

  /* ---- keypad ---- */
  .pad{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-auto-rows:1fr;
    gap:11px;
    margin-top:14px;
    min-height:0;
  }
  button.key{
    border:none;
    border-radius:50px;
    font-size:26px;
    font-weight:500;
    font-family:inherit;
    color:var(--key-ink);
    background:var(--key);
    box-shadow:0 4px 10px rgba(150,120,180,.14);
    transition:transform .06s ease, background .12s ease;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
    cursor:pointer;
    min-height:44px;
  }
  button.key:active{transform:scale(.94);background:var(--key-press);}
  button.key.fn{background:var(--fn);color:var(--fn-ink);font-weight:600;}
  button.key.fn:active{background:var(--fn-press);}
  button.key.hex{background:var(--hex);color:var(--hex-ink);}
  button.key.hex:active{background:var(--hex-press);}
  button.key.wide{grid-column:span 2;}
  button.key:disabled{
    background:var(--disabled);
    color:var(--disabled-ink);
    box-shadow:none;
    cursor:default;
  }
  button.key:disabled:active{transform:none;}

  .hint{
    text-align:center;
    font-size:11px;
    color:var(--on-grad);
    padding-top:8px;
    opacity:.85;
    text-shadow:0 1px 5px rgba(120,80,160,.28);
  }
</style>
</head>
<body>
  <div class="app">
    <header><h1>✨ Base Converter ✨</h1></header>

    <div class="readout" id="readout">
      <div class="row" data-base="2"><span class="tag">BIN</span><span class="val" id="v2">0</span></div>
      <div class="row" data-base="8"><span class="tag">OCT</span><span class="val" id="v8">0</span></div>
      <div class="row active" data-base="10"><span class="tag">DEC</span><span class="val" id="v10">0</span></div>
      <div class="row" data-base="16"><span class="tag">HEX</span><span class="val" id="v16">0</span></div>
    </div>

    <div class="pad" id="pad"></div>
    <div class="hint">Tap a row (BIN · OCT · DEC · HEX) to type in that base</div>
  </div>

<script>
(function(){
  // current value stored as a BigInt; base is the active INPUT base
  let value = 0n;
  let base = 10;

  const digits = "0123456789ABCDEF";

  const els = {
    2: document.getElementById('v2'),
    8: document.getElementById('v8'),
    10: document.getElementById('v10'),
    16: document.getElementById('v16'),
  };

  // group binary in nibbles / others in a readable way
  function grouped(str, size){
    if(str.length <= size) return str;
    let out = '';
    for(let i=str.length; i>0; i-=size){
      const start = Math.max(0, i-size);
      out = str.slice(start,i) + (out ? ' ' : '') + out;
    }
    return out;
  }

  function render(){
    const b2  = value.toString(2).toUpperCase();
    const b8  = value.toString(8).toUpperCase();
    const b10 = value.toString(10);
    const b16 = value.toString(16).toUpperCase();

    els[2].textContent  = grouped(b2, 4);
    els[8].textContent  = grouped(b8, 3);
    els[10].textContent = grouped(b10, 3);
    els[16].textContent = grouped(b16, 4);

    document.querySelectorAll('.row').forEach(r=>{
      r.classList.toggle('active', Number(r.dataset.base) === base);
    });

    // enable/disable digit keys based on active base
    document.querySelectorAll('.key[data-digit]').forEach(k=>{
      const d = digits.indexOf(k.dataset.digit);
      k.disabled = d >= base;
    });
  }

  function pushDigit(ch){
    const d = BigInt(digits.indexOf(ch));
    value = value * BigInt(base) + d;
    render();
  }
  function backspace(){
    value = value / BigInt(base); // integer division drops last digit
    render();
  }
  function clearAll(){
    value = 0n;
    render();
  }
  function setBase(b){
    base = b;
    render();
  }

  // ---- build keypad ----
  // 4-column grid, 5 rows (each row sums to 4 units):
  //   A   B   C   DEL
  //   7   8   9   D
  //   4   5   6   E
  //   1   2   3   F
  //   AC(x2)      0(x2)
  const pad = document.getElementById('pad');
  pad.innerHTML = '';
  const keys = [
    {t:'A', c:'hex', dig:'A'},
    {t:'B', c:'hex', dig:'B'},
    {t:'C', c:'hex', dig:'C'},
    {t:'DEL', c:'fn', fn:backspace},

    {t:'7', dig:'7'},
    {t:'8', dig:'8'},
    {t:'9', dig:'9'},
    {t:'D', c:'hex', dig:'D'},

    {t:'4', dig:'4'},
    {t:'5', dig:'5'},
    {t:'6', dig:'6'},
    {t:'E', c:'hex', dig:'E'},

    {t:'1', dig:'1'},
    {t:'2', dig:'2'},
    {t:'3', dig:'3'},
    {t:'F', c:'hex', dig:'F'},

    {t:'AC', c:'fn wide', fn:clearAll},
    {t:'0', c:'wide', dig:'0'},
  ];

  keys.forEach(k=>{
    const b = document.createElement('button');
    b.className = 'key' + (k.c ? ' ' + k.c : '');
    b.textContent = k.t;
    if(k.dig){
      b.dataset.digit = k.dig;
      b.addEventListener('click', ()=>pushDigit(k.dig));
    } else if(k.fn){
      b.addEventListener('click', k.fn);
    }
    pad.appendChild(b);
  });

  // base selection by tapping a readout row
  document.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('click', ()=>setBase(Number(r.dataset.base)));
  });

  // physical keyboard support (nice on Mac / desktop)
  window.addEventListener('keydown', e=>{
    const k = e.key.toUpperCase();
    if(digits.includes(k) && digits.indexOf(k) < base){ pushDigit(k); e.preventDefault(); }
    else if(e.key === 'Backspace'){ backspace(); e.preventDefault(); }
    else if(e.key === 'Escape'){ clearAll(); e.preventDefault(); }
    else if(k === 'B'){ /* handled as hex digit above when base 16 */ }
  });

  render();
})();
</script>
</body>
</html>
